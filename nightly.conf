#
# drm-tip branch configuration array (declared in dim)
#
# Ordered list of branches in repos to merge to the drm-tip integration branch.
#
# Each entry is a string in format: <repo> <branch> [<override-sha1>]
#
# The closing line is used for scripted updates, do not modify.
#
drm_tip_config=(
	"drm			drm-fixes"
	"drm-misc		drm-misc-fixes"
	"drm-rust		drm-rust-fixes"
	"drm-intel		drm-intel-fixes"
	"drm-xe			drm-xe-fixes"

	"drm			drm-next"
	"drm-misc		drm-misc-next-fixes"
	"drm-rust		drm-rust-next-fixes"
	"drm-intel		drm-intel-next-fixes"
	"drm-xe			drm-xe-next-fixes"

	"drm-misc		drm-misc-next"
	"drm-rust		drm-rust-next"
	"drm-intel		drm-intel-next"
	"drm-intel		drm-intel-gt-next"
	"drm-xe			drm-xe-next"

	"drm-intel		topic/core-for-CI"
	"drm-xe			topic/xe-for-CI"
	"drm		topic/drm-next-nouveau-r570"
	"drm-intel		topic/pipe-reorder"
) # DO NOT CHANGE THIS LINE
